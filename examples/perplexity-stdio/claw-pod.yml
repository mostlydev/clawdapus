# Set PERPLEXITY_KEY in your shell or .env, then run `claw discover perplexity`
# once before `claw up -d`.
# The API key stays on the stdio wrapper sidecar; agent containers only see the
# managed `perplexity.search` tool through cllama.

x-claw:
  pod: perplexity-stdio-example
  # Example policy: relaxes the conservative default (US/EU only, no training,
  # no retention) so the example runs on an ordinary provider account. For real
  # workloads keep the defaults and attest your account's guarantees instead.
  # See https://clawdapus.dev/guide/data-policy
  data-policy-defaults:
    regions: [global]
    training: allowed
    retention: provider-default
    local-retention: allowed

services:
  perplexity:
    image: ghcr.io/mostlydev/claw-mcp-stdio:v0.12.0
    environment:
      PERPLEXITY_API_KEY: ${PERPLEXITY_KEY}
    expose:
      - "8080"
    x-claw:
      mcp-stdio:
        command: npx
        args: ["-y", "perplexity-mcp"]

  allen:
    image: ghcr.io/mostlydev/hermes-base:v2026.5.16-claw.3
    x-claw:
      agent: ./AGENTS.md
      cllama: passthrough
      tools:
        - service: perplexity
          allow: [search]
