x-claw:
  pod: hermes-quickstart
  # Example policy: relaxes the conservative default (US/EU only, no training,
  # no retention) so the example runs on an ordinary provider account. For real
  # workloads keep the defaults and attest your account's guarantees instead.
  # See https://clawdapus.dev/guide/data-policy
  data-policy-defaults:
    regions: [global]
    training: allowed
    retention: provider-default
    local-retention: allowed

services:
  assistant:
    image: hermes-quickstart-assistant:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      agent: ./AGENTS.md
      cllama: passthrough
      cllama-env:
        ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "hermes-assistant"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
              name: "My Server"
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
