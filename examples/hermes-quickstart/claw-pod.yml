x-claw:
  pod: hermes-quickstart
  # Model requests keep the conservative data-policy defaults.
  # Configure a verified route/account before inference; see https://clawdapus.dev/guide/data-policy.

services:
  assistant:
    image: hermes-quickstart-assistant:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      agent: ./AGENTS.md
      cllama: passthrough
      cllama-env:
        ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "hermes-assistant"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
              name: "My Server"
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
