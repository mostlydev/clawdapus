x-claw:
  pod: trading-desk
  master: octopus
  handles-defaults:
    discord:
      guilds:
        - id: "${DISCORD_GUILD_ID}"
          name: "Trading Floor"
          channels:
            - id: "${DISCORD_TRADING_FLOOR_CHANNEL}"
              name: trading-floor
  feeds-defaults:
    - market-context

x-trading-desk:
  cllama-agent: &cllama_agent
    cllama: passthrough
  proxy-env: &proxy_env
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
  master_surfaces: &master_surfaces
    - "service://claw-api"
  shared-trading-surfaces: &shared_trading_surfaces
    - "service://trading-api"
    - "volume://clawd-shared read-write"
  trader-risk-skills: &trader_risk_skills
    - ./policy/risk-limits.md
  compliance-skills: &compliance_skills
    - ./policy/risk-limits.md
    - ./policy/approval-workflow.md

# ─────────────────────────────────────────────────────────────────────────────
# Trading Desk Pod (desk-manager + momentum-trader + systems-monitor + value-trader + micro + hermes)
#
# Mixed-driver pod: openclaw + nanoclaw + nullclaw + microclaw + hermes agents
# coordinating via Discord and a shared research volume.
#
# Required environment variables (.env or Docker secrets):
#   POSTGRES_PASSWORD, SECRET_KEY_BASE
#   DESK_MANAGER_BOT_TOKEN, MOMENTUM_TRADER_BOT_TOKEN, SYSTEMS_MONITOR_BOT_TOKEN, VALUE_TRADER_BOT_TOKEN, MICRO_BOT_TOKEN, HERMES_BOT_TOKEN
#   DESK_MANAGER_DISCORD_ID, MOMENTUM_TRADER_DISCORD_ID, SYSTEMS_MONITOR_DISCORD_ID, VALUE_TRADER_DISCORD_ID, MICRO_DISCORD_ID, HERMES_DISCORD_ID
#   DISCORD_GUILD_ID, DISCORD_TRADING_FLOOR_CHANNEL
#   OPENROUTER_API_KEY, ANTHROPIC_API_KEY (proxy-side provider keys for cllama)
# Note: claw resolves ${...} in x-claw metadata from the pod-local .env before
# generating runtime config. Bot tokens still belong in service environment.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure (non-claw) ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: trading_api_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

  trading-api:
    image: trading-api:latest
    expose:
      - "4000"
    environment:
      PYTHONUNBUFFERED: "1"
      RAILS_ENV: development
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/trading_api_development"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      # Webhook URL for startup announcements — no bot token needed for a non-claw service.
      # CLAW_HANDLE_* vars (agent Discord IDs) are broadcast automatically by claw.
      DISCORD_TRADING_API_WEBHOOK: "${DISCORD_TRADING_API_WEBHOOK}"
    depends_on:
      - postgres

  # ── Desk-Manager — Coordinator, Compliance, News Synthesis ────────────────

  desk-manager:
    image: trading-desk:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      <<: *cllama_agent
      agent: ./agents/DESK-MANAGER.md
      # Provider keys are collected once for the shared pod-level cllama proxy.
      cllama-env: *proxy_env
      feeds:
        - desk-risk-context
      handles:
        discord:
          id: "${DESK_MANAGER_DISCORD_ID}"
          username: "desk-manager"
      surfaces:
        - "service://trading-api"
        - "volume://clawd-shared read-write"
        - channel://discord:
            dm:
              enabled: true
              policy: allowlist
              allow_from:
                - "${OPERATOR_DISCORD_ID}"
      skills: *compliance_skills
      invoke:
        - schedule: "15 8 * * 1-5"
          name: "Pre-market synthesis"
          message: "Pre-market synthesis. Write report to /mnt/clawd-shared/reports/morning/$(date +%Y-%m-%d)-desk-manager.md and post summary to #trading-floor."
          to: trading-floor
        - schedule: "*/30 * * * *"
          name: "Heartbeat"
          message: "Post a brief status update to #trading-floor."
          to: trading-floor
    environment:
      DISCORD_BOT_TOKEN: "${DESK_MANAGER_BOT_TOKEN}"
      CLAW_GREETING_CHANNEL: "${DISCORD_TRADING_FLOOR_CHANNEL}"
      CLAW_GREETING_MESSAGE: "desk-manager online."

  # ── Octopus — Master Claw / Fleet Governor ────────────────────────────────

  octopus:
    image: trading-desk:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      <<: *cllama_agent
      agent: ./agents/OCTOPUS.md
      handles: {}
      feeds:
        - source: claw-api
          path: /fleet/alerts
          ttl: 30
        - desk-risk-context
      surfaces: *master_surfaces
      invoke:
        - schedule: "*/15 * * * *"
          name: "Fleet review"
          message: "Review the latest fleet alerts feed. If there are anomalies, investigate via claw-api and produce a concise governance note with findings and recommended next checks."

  # ── Momentum-Trader — Momentum / Tech Stocks ─────────────────────────────

  momentum-trader:
    image: trading-desk:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      <<: *cllama_agent
      agent: ./agents/MOMENTUM-TRADER.md
      handles:
        discord:
          id: "${MOMENTUM_TRADER_DISCORD_ID}"
          username: "momentum-trader"
      surfaces: *shared_trading_surfaces
      skills: *trader_risk_skills
      invoke:
        - schedule: "0 * * * *"
          name: "Momentum check"
          message: "Scan momentum signals for top tech holdings. Post any high-conviction moves to #trading-floor."
          to: trading-floor
    environment:
      DISCORD_BOT_TOKEN: "${MOMENTUM_TRADER_BOT_TOKEN}"
      CLAW_GREETING_CHANNEL: "${DISCORD_TRADING_FLOOR_CHANNEL}"
      CLAW_GREETING_MESSAGE: "momentum-trader online."

  # ── Systems-Monitor — Systems Monitor (NanoClaw) ──────────────────────────

  systems-monitor:
    image: trading-desk-nanoclaw:latest
    build:
      context: .
      dockerfile: Clawfile.nanoclaw
    x-claw:
      <<: *cllama_agent
      agent: ./agents/SYSTEMS-MONITOR.md
      handles:
        discord:
          id: "${SYSTEMS_MONITOR_DISCORD_ID}"
          username: "systems-monitor"
      surfaces: *shared_trading_surfaces
    environment:
      DISCORD_BOT_TOKEN: "${SYSTEMS_MONITOR_BOT_TOKEN}"

  # ── Value-Trader — Counterparty Sanity Check (NullClaw) ───────────────────

  value-trader:
    image: trading-desk-nullclaw:latest
    build:
      context: .
      dockerfile: Clawfile.nullclaw
    x-claw:
      <<: *cllama_agent
      agent: ./agents/VALUE-TRADER.md
      handles:
        discord:
          id: "${VALUE_TRADER_DISCORD_ID}"
          username: "value-trader"
      surfaces: *shared_trading_surfaces
      skills: *trader_risk_skills
    environment:
      DISCORD_BOT_TOKEN: "${VALUE_TRADER_BOT_TOKEN}"
      CLAW_GREETING_CHANNEL: "${DISCORD_TRADING_FLOOR_CHANNEL}"
      CLAW_GREETING_MESSAGE: "value-trader online."

  # ── Micro — Operations Monitor (MicroClaw) ───────────────────────────────

  micro:
    image: trading-desk-microclaw:latest
    build:
      context: .
      dockerfile: Clawfile.microclaw
    x-claw:
      <<: *cllama_agent
      agent: ./agents/MICRO.md
      handles:
        discord:
          id: "${MICRO_DISCORD_ID}"
          username: "micro"
      surfaces: *shared_trading_surfaces
    environment:
      DISCORD_BOT_TOKEN: "${MICRO_BOT_TOKEN}"
      CLAW_GREETING_CHANNEL: "${DISCORD_TRADING_FLOOR_CHANNEL}"
      CLAW_GREETING_MESSAGE: "microclaw online."

  # ── Hermes — Desk Communications (Hermes) ─────────────────────────────────

  hermes:
    image: trading-desk-hermes:latest
    build:
      context: .
      dockerfile: Clawfile.hermes
    x-claw:
      <<: *cllama_agent
      agent: ./agents/HERMES.md
      handles:
        discord:
          id: "${HERMES_DISCORD_ID}"
          username: "hermes"
      surfaces: *shared_trading_surfaces
    environment:
      DISCORD_BOT_TOKEN: "${HERMES_BOT_TOKEN}"
      CLAW_GREETING_CHANNEL: "${DISCORD_TRADING_FLOOR_CHANNEL}"
      CLAW_GREETING_MESSAGE: "hermes online."
