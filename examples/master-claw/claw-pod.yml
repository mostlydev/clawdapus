x-claw:
  pod: master-claw-demo
  master: governor
  cllama-defaults:
    proxy: [passthrough]
    env:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"

services:
  worker-a:
    image: master-claw-demo:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      agent: ./agents/WORKER.md
      handles:
        discord:
          id: "${WORKER_A_DISCORD_ID}"
          username: "worker-a"
    environment:
      DISCORD_BOT_TOKEN: "${WORKER_A_BOT_TOKEN}"

  worker-b:
    image: master-claw-demo:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      agent: ./agents/WORKER.md
      handles:
        discord:
          id: "${WORKER_B_DISCORD_ID}"
          username: "worker-b"
    environment:
      DISCORD_BOT_TOKEN: "${WORKER_B_BOT_TOKEN}"

  governor:
    image: master-claw-demo:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      agent: ./agents/GOVERNOR.md
      feeds: [fleet-alerts]
      surfaces:
        - "service://claw-api"
      handles:
        discord:
          id: "${GOVERNOR_DISCORD_ID}"
          username: "governor"
      invoke:
        - schedule: "*/5 * * * *"
          name: "Fleet review"
          message: "Run your periodic fleet review. Check the alerts in your context and report."
    environment:
      DISCORD_BOT_TOKEN: "${GOVERNOR_BOT_TOKEN}"
