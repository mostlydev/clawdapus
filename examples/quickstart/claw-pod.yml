x-claw:
  pod: quickstart
  models-defaults:
    primary: openrouter/anthropic/claude-sonnet-5
    fallback: anthropic/claude-haiku-4-5
  # Example policy: relaxes the conservative default (US/EU only, no training,
  # no retention) so the example runs on an ordinary provider account. For real
  # workloads keep the defaults and attest your account's guarantees instead.
  # See https://clawdapus.dev/guide/data-policy
  data-policy-defaults:
    regions: [global]
    training: allowed
    retention: provider-default
    local-retention: allowed
services:
  assistant:
    image: quickstart-assistant:latest
    build:
      context: ./agents/assistant
    x-claw:
      agent: ./agents/assistant/AGENTS.md
      cllama: passthrough
      models:
        primary: openrouter/google/gemini-3.6-flash
      cllama-env:
        OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "quickstart-bot"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
              name: "My Server"
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_BOT_ID: "${DISCORD_BOT_ID}"
