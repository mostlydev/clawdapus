# This fixture reuses one Discord bot identity across multiple runtimes.
# It is for sequential runtime-conformance spikes, not concurrent topology tests.
x-claw:
  pod: rollcall
  sequential-conformance: true

services:
  mem-svc:
    image: rollcall-reference-memory:latest
    build:
      context: ../../examples/reference-memory
      dockerfile: Dockerfile
    expose:
      - "8080"

  oc-roll:
    image: rollcall-openclaw:latest
    build:
      context: .
      dockerfile: agents/oc-roll/Clawfile
    x-claw:
      agent: ./agents/oc-roll/AGENTS.md
      cllama: passthrough
      cllama-env:
        OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
        ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      memory:
        service: mem-svc
        timeout-ms: 1000
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "oc-roll"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
              name: "Roll Call"
              channels:
                - id: "${ROLLCALL_CHANNEL_ID}"
                  name: roll-call
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_BOT_ID: "${DISCORD_BOT_ID}"
      ROLLCALL_CHANNEL_ID: "${ROLLCALL_CHANNEL_ID}"
      CLAW_RUNTIME: "openclaw"

  nb-roll:
    image: rollcall-nanobot:latest
    build:
      context: .
      dockerfile: agents/nb-roll/Clawfile
    x-claw:
      agent: ./agents/nb-roll/AGENTS.md
      cllama: passthrough
      # nb-roll carries the anthropic-messages ingress surface now that the
      # nullclaw/nanoclaw stubs are retired (ADR-026).
      cllama-env:
        ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "nb-roll"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
              name: "Roll Call"
              channels:
                - id: "${ROLLCALL_CHANNEL_ID}"
                  name: roll-call
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_BOT_ID: "${DISCORD_BOT_ID}"
      ROLLCALL_CHANNEL_ID: "${ROLLCALL_CHANNEL_ID}"
      CLAW_RUNTIME: "nanobot"

  pc-roll:
    image: rollcall-picoclaw:latest
    build:
      context: .
      dockerfile: agents/pc-roll/Clawfile
    x-claw:
      agent: ./agents/pc-roll/AGENTS.md
      cllama: passthrough
      cllama-env:
        OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "pc-roll"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
              name: "Roll Call"
              channels:
                - id: "${ROLLCALL_CHANNEL_ID}"
                  name: roll-call
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_BOT_ID: "${DISCORD_BOT_ID}"
      ROLLCALL_CHANNEL_ID: "${ROLLCALL_CHANNEL_ID}"
      CLAW_RUNTIME: "picoclaw"

  hm-roll:
    image: rollcall-hermes:latest
    build:
      context: .
      dockerfile: agents/hm-roll/Clawfile
    x-claw:
      agent: ./agents/hm-roll/AGENTS.md
      cllama: passthrough
      cllama-env:
        ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
        OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "hm-roll"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
              name: "Roll Call"
              channels:
                - id: "${ROLLCALL_CHANNEL_ID}"
                  name: roll-call
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_BOT_ID: "${DISCORD_BOT_ID}"
      ROLLCALL_CHANNEL_ID: "${ROLLCALL_CHANNEL_ID}"
      DISCORD_HOME_CHANNEL: "${ROLLCALL_CHANNEL_ID}"
      GATEWAY_ALLOW_ALL_USERS: "true"
      DISCORD_ALLOW_BOTS: "mentions"
      HERMES_TOOL_PROGRESS_MODE: "off"
      CLAW_RUNTIME: "hermes"
