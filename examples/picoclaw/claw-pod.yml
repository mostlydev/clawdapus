x-claw:
  pod: picoclaw-example
  # Model requests keep the conservative data-policy defaults.
  # Configure a verified route/account before inference; see https://clawdapus.dev/guide/data-policy.

services:
  gateway:
    image: picoclaw-example:latest
    build:
      context: .
      dockerfile: Clawfile
    x-claw:
      agent: ./AGENTS.md
      cllama: passthrough
      cllama-env:
        OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      handles:
        discord:
          id: "${DISCORD_BOT_ID}"
          username: "picoclaw-bot"
          guilds:
            - id: "${DISCORD_GUILD_ID}"
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_BOT_ID: "${DISCORD_BOT_ID}"
